<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Y3 Resource Hub</title>
  <meta name="description" content="Y3 Resource Hub · Y3 编辑器 / AI 开发者的资源社区。社区目标：AI 做图不再是梦想。" />
  <style>
    :root {
      --bg: #0b0d10;
      --panel: #141a21;
      --line: #1f2630;
      --line-soft: #1a2128;
      --text: #e6edf3;
      --muted: #9aa6b2;
      --muted-2: #6f7884;
      --brand: #4f8cff;
      --brand-2: #7aa2ff;
      --accent: #76e0c2;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, "PingFang SC", "Microsoft YaHei", sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: var(--brand); text-decoration: none; }
    a:hover { text-decoration: underline; }

    .container { max-width: 1320px; margin: 0 auto; padding: 0 48px; }
    @media (max-width: 720px) { .container { padding: 0 22px; } }

    /* === HERO：左右大分布 === */
    .hero {
      min-height: 100vh;
      padding: 88px 0 64px;
      background:
          radial-gradient(1100px 700px at 8% 0%, rgba(79,140,255,.20), transparent 60%),
          radial-gradient(900px 600px at 100% 30%, rgba(118,224,194,.12), transparent 60%);
      border-bottom: 1px solid var(--line-soft);
      display: flex;
      align-items: center;
    }
    .hero .layout {
      display: grid;
      grid-template-columns: 1.25fr 1fr;
      gap: 80px;
      align-items: stretch;
      width: 100%;
    }
    @media (max-width: 1000px) {
      .hero .layout { grid-template-columns: 1fr; gap: 48px; }
    }

    /* LEFT */
    .hero-left { display: flex; flex-direction: column; justify-content: center; }

    .pill {
      display: inline-block;
      padding: 7px 16px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--muted);
      font-size: 18px;
      background: rgba(255,255,255,.02);
      letter-spacing: 0.01em;
      width: max-content;
    }
    h1 {
      font-size: clamp(48px, 5vw, 80px);
      line-height: 1.05;
      margin: 24px 0 18px;
      letter-spacing: -0.025em;
      font-weight: 700;
      white-space: nowrap;
    }
    .sub {
      color: var(--text);
      font-size: clamp(22px, 1.8vw, 28px);
      line-height: 1.35;
      margin: 0 0 8px;
      font-weight: 500;
      letter-spacing: -0.005em;
    }
    .desc {
      color: var(--muted);
      font-size: 16.5px;
      line-height: 1.65;
      margin: 28px 0 0;
      max-width: 540px;
    }
    .desc code {
      background: rgba(255,255,255,.05);
      padding: 2px 7px;
      border-radius: 5px;
      border: 1px solid var(--line);
      font-size: 15px;
    }

    .actions {
      display: flex;
      gap: 12px;
      margin: 36px 0 0;
      flex-wrap: wrap;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 13px 24px;
      border-radius: 10px;
      font-weight: 600;
      font-size: 15.5px;
      transition: transform .14s ease, background .14s ease, border-color .14s ease;
    }
    .btn-primary {
      background: var(--brand);
      color: #fff;
      box-shadow: 0 8px 28px -10px rgba(79,140,255,.6);
    }
    .btn-primary:hover { background: #3f7af0; text-decoration: none; transform: translateY(-1px); }
    .btn-secondary {
      background: var(--panel);
      color: var(--text);
      border: 1px solid var(--line);
    }
    .btn-secondary:hover { border-color: var(--brand); text-decoration: none; transform: translateY(-1px); }

    /* RIGHT：可滚动 AI 大神榜 */
    .hero-right {
      display: flex;
      flex-direction: column;
      min-height: 460px;
    }
    .lb-card {
      flex: 1;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: linear-gradient(180deg, rgba(255,255,255,.02), rgba(255,255,255,.005));
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .lb-head {
      padding: 22px 22px 14px;
      border-bottom: 1px solid var(--line-soft);
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      flex-shrink: 0;
    }
    .lb-title { font-size: 18px; font-weight: 700; letter-spacing: -0.01em; }
    .lb-meta { font-size: 13px; color: var(--muted); }
    .lb-meta a { color: var(--muted); }

    .lb-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px 0;
      scrollbar-width: thin;
      scrollbar-color: var(--line) transparent;
    }
    .lb-list::-webkit-scrollbar { width: 6px; }
    .lb-list::-webkit-scrollbar-thumb { background: var(--line); border-radius: 4px; }
    .lb-list::-webkit-scrollbar-track { background: transparent; }

    .lb-row {
      display: grid;
      grid-template-columns: 44px 1fr 88px;
      align-items: center;
      gap: 14px;
      padding: 14px 22px;
      border-bottom: 1px solid var(--line-soft);
      transition: background .14s ease;
    }
    .lb-row:hover { background: rgba(79,140,255,.05); }
    .lb-row:last-child { border-bottom: none; }
    .lb-rank {
      font-weight: 700;
      color: var(--muted-2);
      font-variant-numeric: tabular-nums;
      font-size: 17px;
      text-align: center;
    }
    .lb-row.top1 .lb-rank { color: #f5c84c; }
    .lb-row.top2 .lb-rank { color: #c0c8d2; }
    .lb-row.top3 .lb-rank { color: #c98a5b; }

    .lb-avatar {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }
    .lb-avatar img {
      width: 32px; height: 32px; border-radius: 50%;
      border: 1px solid var(--line);
      background: var(--line-soft);
    }
    .lb-name {
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 220px;
    }
    .lb-name a { color: var(--text); }
    .lb-name a:hover { color: var(--brand); text-decoration: none; }
    .lb-handle {
      color: var(--muted-2);
      font-size: 12px;
      font-variant-numeric: tabular-nums;
      margin-top: 2px;
    }

    .lb-score {
      color: var(--brand-2);
      font-variant-numeric: tabular-nums;
      font-weight: 700;
      text-align: right;
      font-size: 16px;
    }
    .lb-empty {
      padding: 60px 24px;
      color: var(--muted);
      font-size: 14.5px;
      text-align: center;
      line-height: 1.7;
    }

    /* === Footer === */
    footer.foot {
      padding: 28px 0 44px;
      border-top: 1px solid var(--line-soft);
      color: var(--muted);
      font-size: 13.5px;
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      justify-content: space-between;
    }
    footer a { color: var(--muted); }
    footer a:hover { color: var(--brand); }

    @media (max-width: 720px) {
      h1 { font-size: 42px; white-space: normal; }
      .sub { font-size: 20px; }
      .hero { min-height: auto; padding: 56px 0 32px; }
    }
  </style>
</head>
<body>

  <!-- HERO -->
  <header class="hero">
    <div class="container">
      <div class="layout">
        <!-- LEFT -->
        <div class="hero-left">
          <span class="pill">资源社区 · Y3 / AI</span>
          <h1>Y3 Resource Hub</h1>
          <p class="sub">社区目标：AI 做图不再是梦想</p>
          <div class="actions">
            <a class="btn btn-primary" href="https://163.com/y3/docs/guides/Editor/AI_Development/AssistantDevelopment" target="_blank" rel="noopener">AI 开发者文档 →</a>
            <a class="btn btn-secondary" href="https://gitee.com/kky3rpg/y3-resource-hub/wikis/Home" target="_blank" rel="noopener">社区 Skill →</a>
          </div>
          <p class="desc">
            让作者省事地分享，让读者省事地找到。
            <br />不会 Git 也能投稿：点 <code>社区 Skill</code>，填表就行。
          </p>
        </div>

        <!-- RIGHT：AI 大神 Top10（可滚动） -->
        <aside class="hero-right">
          <div class="lb-card">
            <div class="lb-head">
              <div class="lb-title">🏆 AI 大神 · Top 10</div>
              <div class="lb-meta">Gitee Wiki / Issue 评分 · <a href="leaderboard.html">完整榜单 →</a></div>
            </div>
            <div class="lb-list" id="lb-list">
              <div class="lb-empty">正在加载贡献数据…<br/>欢迎 <a href="https://gitee.com/kky3rpg/y3-resource-hub/wikis" target="_blank" rel="noopener">在 Wiki 投稿</a> 冲榜</div>
            </div>
          </div>
        </aside>
      </div>
    </div>
  </header>

  <footer class="foot container">
    <div>Y3 Resource Hub · 社区驱动</div>
    <div>反馈：新建 <a href="https://gitee.com/kky3rpg/y3-resource-hub/issues/new?template=resource_submit.yml" target="_blank" rel="noopener">Issue</a> · Wiki 评论</div>
  </footer>

  <script>
    // Gitee Issues + PR 评分制排行榜（Top10 + 可滚动）
    (async function () {
      const root = document.getElementById('lb-list');
      if (!root) return;
      const REPO = 'kky3rpg/y3-resource-hub';
      const API = 'https://gitee.com/api/v5/repos/' + REPO;

      async function fetchAll(path) {
        const all = [];
        let page = 1;
        while (true) {
          const res = await fetch(`${API}/${path}?state=all&per_page=100&page=${page}`);
          if (!res.ok) break;
          const arr = await res.json();
          if (!Array.isArray(arr) || arr.length === 0) break;
          all.push(...arr);
          if (arr.length < 100) break;
          page += 1;
        }
        return all;
      }
      function scoreOf(item, isPR) {
        const labels = (item.labels || []).map(l => (l.name || '').toLowerCase());
        let s = isPR ? 15 : 5;
        if (labels.includes('已收录')) s += 10;
        if (labels.includes('教程踩坑')) s += 5;
        if (labels.some(l => ['mcp', 'skill', '地图案例'].includes(l))) s += 3;
        return s;
      }
      function avatarOf(u) {
        return (u && u.avatar_url) || 'data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22><circle cx=%2212%22 cy=%2212%22 r=%2212%22 fill=%22%23222%22/></svg>';
      }
      function escapeHtml(s) { return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

      try {
        const [issues, prs] = await Promise.all([fetchAll('issues').catch(() => []), fetchAll('pulls').catch(() => [])]);
        const map = new Map();
        function add(u, delta) {
          if (!u || !u.login) return;
          const c = map.get(u.login) || { login: u.login, name: u.name, avatar: avatarOf(u), score: 0, items: 0 };
          c.score += delta; c.items += 1;
          if (!c.name) c.name = u.name;
          map.set(u.login, c);
        }
        issues.forEach(it => add(it.user, scoreOf(it, false)));
        prs.forEach(pr => {
          const merged = pr.merged === true || pr.state === 'merged';
          const closed = pr.state === 'closed' && !merged;
          if (closed) return;
          add(pr.user, scoreOf(pr, true));
        });
        const list = Array.from(map.values()).sort((a, b) => b.score - a.score || b.items - a.items).slice(0, 10);

        if (list.length === 0) {
          root.innerHTML = '<div class="lb-empty">暂无贡献数据 · 欢迎 <a href="https://gitee.com/kky3rpg/y3-resource-hub/issues/new?template=resource_submit.yml" target="_blank" rel="noopener">提交第一个 Issue</a> 冲榜</div>';
          return;
        }
        root.innerHTML = list.map((c, i) => `
          <div class="lb-row top${i+1}">
            <div class="lb-rank">#${i + 1}</div>
            <div class="lb-avatar">
              <img src="${c.avatar}" alt="${escapeHtml(c.login)}" />
              <div style="min-width:0">
                <div class="lb-name"><a href="https://gitee.com/${escapeHtml(c.login)}" target="_blank" rel="noopener">${escapeHtml(c.name || c.login)}</a></div>
                <div class="lb-handle">@${escapeHtml(c.login)} · ${c.items} 项</div>
              </div>
            </div>
            <div class="lb-score">${c.score} 分</div>
          </div>
        `).join('');
      } catch (err) {
        root.innerHTML = '<div class="lb-empty">加载失败，请稍后再试。<br/>可以到 <a href="https://gitee.com/kky3rpg/y3-resource-hub/issues" target="_blank" rel="noopener">Gitee Issues</a> 查看贡献者。</div>';
      }
    })();
  </script>
</body>
</html>

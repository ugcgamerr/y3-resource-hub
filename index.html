<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Y3 Resource Hub</title>
  <meta name="description" content="Y3 Resource Hub · Y3 编辑器 / AI 开发者的资源社区。社区目标：AI 做图不再是梦想。" />
  <style>
    :root {
      --bg: #0b0d10;
      --panel: #11161b;
      --line: #1f2630;
      --text: #e6edf3;
      --muted: #9aa6b2;
      --brand: #4f8cff;
      --code: #0d1117;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, "PingFang SC", "Microsoft YaHei", sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: var(--brand); text-decoration: none; }
    a:hover { text-decoration: underline; }

    .wrap { max-width: 820px; margin: 0 auto; padding: 88px 24px 80px; }

    .pill {
      display: inline-block;
      padding: 5px 12px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--muted);
      font-size: 12.5px;
      background: var(--panel);
    }
    h1 { font-size: 44px; line-height: 1.15; margin: 22px 0 14px; letter-spacing: -0.02em; font-weight: 700; }
    .sub {
      color: var(--muted);
      font-size: 18px;
      line-height: 1.5;
      margin: 0 0 10px;
    }
    .lead {
      color: var(--muted);
      font-size: 15.5px;
      line-height: 1.6;
      margin: 36px 0 0;
      max-width: 560px;
    }

    .actions {
      display: flex;
      gap: 10px;
      margin: 36px 0 0;
      flex-wrap: wrap;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 11px 18px;
      border-radius: 10px;
      font-weight: 600;
      font-size: 15px;
      transition: transform .12s ease, background .12s ease;
    }
    .btn-primary {
      background: var(--brand);
      color: #fff;
    }
    .btn-primary:hover { background: #3f7af0; text-decoration: none; }
    .btn-secondary {
      background: var(--panel);
      color: var(--text);
      border: 1px solid var(--line);
    }
    .btn-secondary:hover { border-color: var(--brand); text-decoration: none; }

    section.lb {
      margin-top: 80px;
      padding-top: 28px;
      border-top: 1px solid var(--line);
    }
    .lb-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 18px;
    }
    .lb-title { font-size: 18px; font-weight: 600; }
    .lb-meta { font-size: 13px; color: var(--muted); }
    .lb-meta a { color: var(--muted); }

    .lb-table {
      display: table;
      width: 100%;
      border-collapse: collapse;
    }
    .lb-row {
      display: table-row;
    }
    .lb-row > * {
      display: table-cell;
      padding: 11px 0;
      border-bottom: 1px solid var(--line);
      vertical-align: middle;
    }
    .lb-row:hover > * { background: var(--panel); }
    .lb-rank { width: 44px; color: var(--muted); font-variant-numeric: tabular-nums; font-weight: 600; }
    .lb-row.top1 .lb-rank { color: #f5c84c; }
    .lb-row.top2 .lb-rank { color: #c0c8d2; }
    .lb-row.top3 .lb-rank { color: #c98a5b; }
    .lb-name { font-weight: 600; }
    .lb-name a { color: var(--text); }
    .lb-name a:hover { color: var(--brand); }
    .lb-handle { color: var(--muted); font-size: 13px; margin-left: 6px; }
    .lb-bar-cell { width: 100%; padding-right: 16px; }
    .lb-bar { height: 6px; background: var(--line); border-radius: 4px; overflow: hidden; }
    .lb-bar > span { display: block; height: 100%; background: var(--brand); }
    .lb-score { width: 110px; text-align: right; color: var(--brand); font-variant-numeric: tabular-nums; font-weight: 600; }
    .lb-empty { padding: 22px 0; color: var(--muted); font-size: 14px; }

    footer.foot {
      margin-top: 56px;
      padding-top: 18px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 13px;
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      justify-content: space-between;
    }

    @media (max-width: 560px) {
      .wrap { padding: 56px 18px 56px; }
      h1 { font-size: 32px; }
      .sub { font-size: 16px; }
      .lb-table, .lb-row, .lb-row > * { display: block; }
      .lb-row { padding: 10px 0; border-bottom: 1px solid var(--line); }
      .lb-bar-cell, .lb-score { padding: 6px 0 0; }
      .lb-score { text-align: left; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <span class="pill">资源社区 · Y3 / AI</span>
    <h1>Y3 Resource Hub</h1>
    <p class="sub">社区目标：AI 做图不再是梦想</p>

    <div class="actions">
      <a class="btn btn-primary" href="https://163.com/y3/docs/guides/Editor/AI_Development/AssistantDevelopment" target="_blank" rel="noopener">AI 开发者文档 →</a>
      <a class="btn btn-secondary" href="https://gitee.com/kky3rpg/y3-resource-hub/wikis/Home" target="_blank" rel="noopener">社区 Skill →</a>
    </div>

    <p class="lead">
      让作者省事地分享，让读者省事地找到。
      <br />
      不会 Git 也能投稿：点 <code style="background:var(--code);padding:2px 6px;border-radius:4px;border:1px solid var(--line);font-size:13px;">社区 Skill</code> 即可。
    </p>

    <section class="lb">
      <div class="lb-head">
        <div class="lb-title">🏆 AI 大神 · Top 10</div>
        <div class="lb-meta">Gitee Issues / PR 贡献评分 · <a href="leaderboard.html">完整榜单 →</a></div>
      </div>
      <div class="lb-table" id="lb-table">
        <div class="lb-empty">正在加载贡献数据…</div>
      </div>
    </section>

    <footer class="foot">
      <div>Y3 Resource Hub · 社区驱动</div>
      <div>反馈：新建 <a href="https://gitee.com/kky3rpg/y3-resource-hub/issues/new?template=resource_submit.yml" target="_blank" rel="noopener">Issue</a> · Wiki 评论</div>
    </footer>
  </div>

  <script>
    // Gitee Issues + PR 评分制排行榜（紧凑表格版）
    (async function () {
      const root = document.getElementById('lb-table');
      if (!root) return;
      const REPO = 'kky3rpg/y3-resource-hub';
      const API = 'https://gitee.com/api/v5/repos/' + REPO;

      async function fetchAll(path) {
        const all = [];
        let page = 1;
        while (true) {
          const res = await fetch(`${API}/${path}?state=all&per_page=100&page=${page}`);
          if (!res.ok) break;
          const arr = await res.json();
          if (!Array.isArray(arr) || arr.length === 0) break;
          all.push(...arr);
          if (arr.length < 100) break;
          page += 1;
        }
        return all;
      }
      function scoreOf(item, isPR) {
        const labels = (item.labels || []).map(l => (l.name || '').toLowerCase());
        let s = isPR ? 15 : 5;
        if (labels.includes('已收录')) s += 10;
        if (labels.includes('教程踩坑')) s += 5;
        if (labels.some(l => ['mcp', 'skill', '地图案例'].includes(l))) s += 3;
        return s;
      }
      function avatarOf(u) {
        return (u && u.avatar_url) || 'data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22><circle cx=%2212%22 cy=%2212%22 r=%2212%22 fill=%22%23222%22/></svg>';
      }
      function escapeHtml(s) { return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

      try {
        const [issues, prs] = await Promise.all([fetchAll('issues').catch(() => []), fetchAll('pulls').catch(() => [])]);
        const map = new Map();
        function add(u, delta) {
          if (!u || !u.login) return;
          const c = map.get(u.login) || { login: u.login, name: u.name, avatar: avatarOf(u), score: 0, items: 0 };
          c.score += delta; c.items += 1;
          if (!c.name) c.name = u.name;
          if (!c.avatar) c.avatar = avatarOf(u);
          map.set(u.login, c);
        }
        issues.forEach(it => add(it.user, scoreOf(it, false)));
        prs.forEach(pr => {
          const merged = pr.merged === true || pr.state === 'merged';
          const closed = pr.state === 'closed' && !merged;
          if (closed) return;
          add(pr.user, scoreOf(pr, true));
        });
        const list = Array.from(map.values()).sort((a, b) => b.score - a.score || b.items - a.items).slice(0, 10);

        if (list.length === 0) {
          root.innerHTML = '<div class="lb-empty">暂无贡献数据 · 欢迎 <a href="https://gitee.com/kky3rpg/y3-resource-hub/issues/new?template=resource_submit.yml" target="_blank" rel="noopener">提交第一个 Issue</a> 冲榜</div>';
          return;
        }
        const max = list[0].score || 1;
        root.innerHTML = list.map((c, i) => {
          const pct = Math.max(6, Math.round((c.score / max) * 100));
          return `
            <div class="lb-row top${i+1}">
              <div class="lb-rank">#${i + 1}</div>
              <div class="lb-name">
                <a href="https://gitee.com/${escapeHtml(c.login)}" target="_blank" rel="noopener">${escapeHtml(c.name || c.login)}</a>
                <span class="lb-handle">@${escapeHtml(c.login)}</span>
              </div>
              <div class="lb-bar-cell"><div class="lb-bar"><span style="width:${pct}%"></span></div></div>
              <div class="lb-score">${c.score} 分</div>
            </div>
          `;
        }).join('');
      } catch (err) {
        root.innerHTML = '<div class="lb-empty">加载失败，请稍后再试。<br/>可以到 <a href="https://gitee.com/kky3rpg/y3-resource-hub/issues" target="_blank" rel="noopener">Gitee Issues</a> 查看贡献者。</div>';
      }
    })();
  </script>
</body>
</html>

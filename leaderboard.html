<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>AI 大神排行榜 · Y3 Resource Hub</title>
  <link rel="icon" href="https://gitee.com/favicon.ico" />
  <style>
    :root {
      --bg: #0b0d10;
      --panel: #11161b;
      --line: #1f2630;
      --text: #e6edf3;
      --muted: #9aa6b2;
      --brand: #4f8cff;
      --brand-2: #7aa2ff;
      --code: #0d1117;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, "PingFang SC", "Microsoft YaHei", sans-serif; }
    a { color: var(--brand-2); text-decoration: none; }
    a:hover { color: var(--brand); }
    .wrap { max-width: 880px; margin: 0 auto; padding: 56px 24px 64px; }
    h1 { font-size: 32px; margin: 0 0 8px; letter-spacing: -0.01em; }
    .sub { color: var(--muted); margin: 0 0 28px; font-size: 14.5px; }
    .sub a { color: var(--brand-2); }

    .grid { display: grid; gap: 10px; margin: 0; padding: 0; list-style: none; }
    .row {
      display: grid;
      grid-template-columns: 56px 1fr auto;
      align-items: center;
      gap: 16px;
      padding: 14px 16px;
      border-radius: 12px;
      border: 1px solid var(--line);
      background: var(--panel);
    }
    .row:hover { border-color: var(--brand); }
    .rank { font-weight: 700; color: var(--muted); text-align: center; font-variant-numeric: tabular-nums; font-size: 16px; }
    .row.top1 .rank { color: #f5c84c; }
    .row.top2 .rank { color: #c0c8d2; }
    .row.top3 .rank { color: #c98a5b; }
    .user { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .user img { width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--line); }
    .name { font-weight: 600; color: var(--text); }
    .profile { color: var(--muted); font-size: 12.5px; }
    .count { color: var(--brand-2); font-variant-numeric: tabular-nums; font-weight: 700; font-size: 18px; }
    .empty { color: var(--muted); padding: 24px; text-align: center; border: 1px dashed var(--line); border-radius: 12px; }

    .bar { height: 6px; background: var(--line); border-radius: 4px; margin-top: 6px; overflow: hidden; }
    .bar > span { display: block; height: 100%; background: linear-gradient(90deg, var(--brand), var(--brand-2)); }

    .foot {
      margin-top: 28px;
      color: var(--muted);
      font-size: 13px;
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      justify-content: space-between;
    }

    .toolbar {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      align-items: center;
      margin: 0 0 16px;
    }
    .toolbar input, .toolbar select {
      background: var(--panel);
      border: 1px solid var(--line);
      color: var(--text);
      padding: 8px 12px;
      border-radius: 10px;
      font-size: 13px;
    }
    .toolbar .pill {
      color: var(--muted);
      font-size: 12.5px;
      border: 1px solid var(--line);
      padding: 6px 10px;
      border-radius: 999px;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>🏆 AI 大神排行榜</h1>
    <p class="sub">
      数据源：<a href="https://github.com/ugcgamerr/y3-resource-hub/graphs/contributors" target="_blank" rel="noopener">GitHub Contributors</a>
      · 排名依据：贡献次数（commits + pull requests + issues）
      · <a href="./">← 返回入口页</a>
    </p>

    <div class="toolbar">
      <input id="q" placeholder="按昵名筛选…" />
      <span class="pill" id="stat">加载中…</span>
    </div>

    <ul class="grid" id="lb">
      <li class="empty">正在加载 Gitee 贡献数据…</li>
    </ul>

    <div class="foot">
      <span>本榜单自动刷新，不修改任何数据</span>
      <span>API: gitee.com/api/v5/repos/kky3rpg/y3-resource-hub</span>
    </div>
  </div>

  <script>
    (async function () {
      const ul = document.getElementById('lb');
      const stat = document.getElementById('stat');
      const q = document.getElementById('q');
      const REPO = 'kky3rpg/y3-resource-hub';
      const API = 'https://gitee.com/api/v5/repos/' + REPO;

      async function fetchAll(path) {
        const all = [];
        let page = 1;
        while (true) {
          const res = await fetch(`${API}/${path}?state=all&per_page=100&page=${page}`);
          if (!res.ok) break;
          const arr = await res.json();
          if (!Array.isArray(arr) || arr.length === 0) break;
          all.push(...arr);
          if (arr.length < 100) break;
          page += 1;
        }
        return all;
      }

      function scoreOf(item, isPR) {
        const labels = (item.labels || []).map(l => (l.name || '').toLowerCase());
        let s = isPR ? 15 : 5;
        if (labels.includes('已收录')) s += 10;
        if (labels.includes('教程踩坑')) s += 5;
        if (labels.some(l => ['mcp', 'skill', '地图案例'].includes(l))) s += 3;
        return s;
      }
      function avatarOf(u) {
        return (u && u.avatar_url) || 'data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22><circle cx=%2216%22 cy=%2216%22 r=%2216%22 fill=%22%23222%22/><text x=%2216%22 y=%2221%22 text-anchor=%22middle%22 font-size=%2214%22 fill=%22%23fff%22>?</text></svg>';
      }
      function profileUrl(login) { return 'https://gitee.com/' + login; }

      let cache = [];
      try {
        const [issues, prs] = await Promise.all([fetchAll('issues').catch(() => []), fetchAll('pulls').catch(() => [])]);
        const map = new Map();
        function add(u, delta) {
          if (!u || !u.login) return;
          const c = map.get(u.login) || { login: u.login, name: u.name, avatar: avatarOf(u), score: 0, items: 0 };
          c.score += delta;
          c.items += 1;
          if (!c.name) c.name = u.name;
          if (!c.avatar) c.avatar = avatarOf(u);
          map.set(u.login, c);
        }
        issues.forEach(it => add(it.user, scoreOf(it, false)));
        prs.forEach(pr => {
          const merged = pr.merged === true || pr.state === 'merged';
          const closed = pr.state === 'closed' && !merged;
          if (closed) return;
          add(pr.user, scoreOf(pr, true));
        });
        cache = Array.from(map.values()).sort((a, b) => b.score - a.score || b.items - a.items);
        if (cache.length === 0) {
          ul.innerHTML = '<li class="empty">暂无贡献数据 · 欢迎 <a href="https://gitee.com/kky3rpg/y3-resource-hub/issues/new?template=resource_submit.yml" target="_blank" rel="noopener">提交第一个 Issue</a> 冲榜</li>';
          stat.textContent = '共 0 位贡献者';
          return;
        }
        const maxScore = cache[0].score || 1;
        const totalScore = cache.reduce((s, c) => s + c.score, 0);
        stat.textContent = `共 ${cache.length} 位贡献者 · 累计 ${totalScore} 分 · 榜首 ${maxScore} 分`;
        render(cache, maxScore);
        q.addEventListener('input', () => {
          const kw = q.value.toLowerCase();
          render(cache.filter(c => c.login.toLowerCase().includes(kw) || (c.name||'').toLowerCase().includes(kw)), maxScore);
        });
      } catch (err) {
        ul.innerHTML = '<li class="empty">加载失败，请稍后再试。<br/>可以到 <a href="https://gitee.com/kky3rpg/y3-resource-hub/issues" target="_blank" rel="noopener">Gitee Issues</a> 查看贡献者。</li>';
        stat.textContent = '加载失败';
      }

      function render(list, max) {
        if (list.length === 0) { ul.innerHTML = '<li class="empty">没有匹配的贡献者</li>'; return; }
        ul.innerHTML = list.map((c) => {
          const rank = cache.indexOf(c);
          const cls = rank === 0 ? 'top1' : (rank === 1 ? 'top2' : (rank === 2 ? 'top3' : ''));
          const pct = Math.round((c.score / max) * 100);
          const profile = profileUrl(c.login);
          return `
            <li class="row ${cls}">
              <div class="rank">#${rank + 1}</div>
              <div>
                <div class="user">
                  <img src="${c.avatar}" alt="${esc(c.login)}" />
                  <div>
                    <div class="name"><a href="${profile}" target="_blank" rel="noopener">${esc(c.name || c.login)}</a></div>
                    <div class="profile">@${esc(c.login)} · ${c.items} 项</div>
                  </div>
                </div>
                <div class="bar"><span style="width:${pct}%"></span></div>
              </div>
              <div class="count">${c.score}</div>
            </li>
          `;
        }).join('');
      }
    })();

    function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
  </script>
</body>
</html>

name: 资源投稿（表单）
description: 分享 MCP / Skill / 示例 / 教程（推荐入口：不会 Git 也能用）
title: "[资源投稿]："
labels: ["resource"]
body:
  - type: markdown
    attributes:
      value: |
        感谢你分享资源！你只要把关键信息填完整，维护者会帮你整理入库。

  - type: dropdown
    id: category
    attributes:
      label: 资源分类
      description: 请选择你的资源类型
      options:
        - MCP 服务
        - Skill
        - 地图案例 / 示例
        - 教程 / 踩坑
      multiple: false

  - type: input
    id: name
    attributes:
      label: 资源名称
      description: 你希望大家怎么称呼这个资源？
      placeholder: 例如：地形导出 Skill / pathfinding-mcp / XXX 教程

  - type: textarea
    id: summary
    attributes:
      label: 一句话用途
      description: 这个资源解决什么问题？适合谁用？
      placeholder: 例如：用 AI 自动生成地图任务脚本并导入编辑器

  - type: textarea
    id: steps
    attributes:
      label: 安装/使用步骤
      description: 越简单越好，但要能复现。可以用 1/2/3 步骤写清楚。
      placeholder: |
        1. ...
        2. ...
        3. ...

  - type: textarea
    id: links
    attributes:
      label: 资源链接或附件
      description: 代码仓库链接、网盘链接、压缩包、截图/视频等都可以。尽量给可长期访问的链接。
      placeholder: |
        - 仓库：https://...
        - 下载：https://...
        - 演示视频：https://...

  - type: input
    id: compat
    attributes:
      label: 适配版本
      description: 例如 Y3 编辑器版本、依赖的 MCP/模型版本等
      placeholder: 例如：Y3 v0.9.x；需要 Python 3.10；需要某某模型

  - type: textarea
    id: risk
    attributes:
      label: 风险说明
      description: 是否联网？是否会执行命令？是否会读写本地文件？是否需要 Token/Key？
      placeholder: |
        - 联网：是/否（会访问：xxx）
        - 执行命令：是/否（会执行：xxx）
        - 读写文件：是/否（会写入：xxx）
        - 需要密钥：是/否（需要：xxx）

  - type: input
    id: author
    attributes:
      label: 作者署名
      description: 你希望展示的名字/昵称
      placeholder: 例如：小明 / y3-xxx

  - type: input
    id: contact
    attributes:
      label: 联系方式
      description: 仅用于维护者在需要补充信息时联系你（例如邮箱/群号/其他）
      placeholder: 例如：xxx@qq.com / 飞书号 / QQ 群

  - type: checkboxes
    attributes:
      label: 投稿确认
      options:
        - label: 我确认分享内容不包含账号密码、Token、个人隐私等敏感信息
          required: true
        - label: 我确认我有权分享该内容（或已获得原作者许可）
          required: true